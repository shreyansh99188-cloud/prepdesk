<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PrepDesk: JEE and NEET study planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FB; --paper:#FFFFFF; --ink:#131A33; --ink2:#4A5478; --ink3:#7A85A6; --line:#D9DFEE; --wash:#E7ECF8;
  --accent:#2340C8; --on-accent:#FFFFFF; --hi:#FFE45C; --red:#C93342; --on-red:#FFFFFF; --ok:#17835A;
  --phy:#3B6CF6; --chem:#0E9F8E; --math:#8B5CF6; --bot:#64A82F; --zoo:#E98A15;
  --t-concept:#8B5CF6; --t-calc:#3B6CF6; --t-silly:#E98A15; --t-time:#D6409F; --t-guess:#7A85A6;
  --f-d:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-b:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --paper:#121A33; --ink:#E8ECFA; --ink2:#AAB3D2; --ink3:#7C87AE; --line:#26315C; --wash:#19234A;
    --accent:#8FA5FF; --on-accent:#0B1020; --red:#FF7C88; --on-red:#2A0509; --ok:#4FD69C;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --paper:#121A33; --ink:#E8ECFA; --ink2:#AAB3D2; --ink3:#7C87AE; --line:#26315C; --wash:#19234A;
  --accent:#8FA5FF; --on-accent:#0B1020; --red:#FF7C88; --on-red:#2A0509; --ok:#4FD69C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-b);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;letter-spacing:-.02em}
h1{font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1.04}
h2{font-weight:700;font-size:21px;line-height:1.2}
h3{font-weight:700;font-size:22px;margin-bottom:8px}
h4{font-weight:700;font-size:16px;margin:18px 0 6px}
p{margin:0}
.muted{color:var(--ink2)} .sm{font-size:14px} .grow{flex:1;min-width:0}

.wrap{max-width:680px;margin:0 auto;padding:12px 20px 140px}
.top{display:flex;align-items:center;gap:8px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:9px;font:800 21px var(--f-d);letter-spacing:-.03em;margin-right:auto}
.logo{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent);position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;cursor:pointer;min-height:36px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.sec{padding-top:26px;margin-top:26px;border-top:1px solid var(--line)}
.sec.first{border-top:0;margin-top:0;padding-top:6px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h+.muted{margin:-6px 0 14px}

.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;min-height:44px;cursor:pointer}
.btn.sm{padding:7px 14px;min-height:40px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--red);color:var(--on-red)}
.btn.big{min-width:140px;font-size:17px;min-height:52px;border-radius:14px}
.btn:active{transform:translateY(1px)}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:88px}
.add{display:flex;gap:10px;margin-bottom:6px}
.add .btn{flex:none}
.field{display:grid;gap:6px;margin:0 0 14px;font-weight:700;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin-top:6px}

.stats{display:flex;margin-top:22px}
.stats>div{flex:1;padding:0 14px;border-left:1px solid var(--line)}
.stats>div:first-child{padding-left:0;border-left:0}
.stats b{display:block;font:800 23px/1.15 var(--f-d);letter-spacing:-.02em}
.stats span{color:var(--ink2);font-size:13px}
.pill{display:inline-block;background:var(--hi);color:#131A33;font-weight:700;border-radius:99px;padding:1px 10px;font-size:13px}

/* OMR bubbles: the one signature element */
.bub{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink3);background:transparent;color:var(--ink3);font:700 12px/1 var(--f-d);display:inline-grid;place-items:center;padding:0;cursor:pointer;position:relative;transition:background .15s,border-color .15s,color .15s}
.bub::after{content:"";position:absolute;inset:-8px}
.bub.on{background:var(--accent);border-color:var(--accent);color:transparent;animation:pop .2s}
.bub.sm{width:26px;height:26px;flex:none}
@keyframes pop{50%{transform:scale(1.2)}}
.hbs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.hb{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink3);background:conic-gradient(var(--accent) calc(var(--f) * 360deg),transparent 0)}
.stepper{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:18px;line-height:1;cursor:pointer}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row.done .grow{color:var(--ink3);text-decoration:line-through}
.x{background:none;border:0;color:var(--ink3);font-size:22px;line-height:1;min-width:40px;min-height:40px;cursor:pointer}
.empty{color:var(--ink2);padding:6px 0 4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}

.heat{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-rows:repeat(7,auto);gap:4px}
.hc{display:block;aspect-ratio:1;border-radius:50%;background:var(--wash)}
.hc.l1,.hc.l2,.hc.l3,.hc.l4{background:var(--accent)}
.hc.l1{opacity:.25}.hc.l2{opacity:.5}.hc.l3{opacity:.75}
.hc.fut{background:transparent;border:1px dashed var(--line)}
.hc.now{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:13px;color:var(--ink2)}
.legend .hc{width:12px;height:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:700;opacity:.75}

.ringwrap{position:relative;width:min(76vw,290px);margin:20px auto 16px}
.ring{width:100%;display:block;transform:rotate(-90deg)}
.track{fill:none;stroke:var(--wash);stroke-width:12}
.arc{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ringwrap.brk .arc{stroke:var(--ok)}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px}
.clock{font:800 clamp(48px,14vw,66px)/1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.center{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;font-weight:700}

.meter{height:8px;border-radius:99px;background:var(--wash);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .3s}
.sstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:4px 0 6px}
.sstats div{font-size:13px;color:var(--ink2)}
.sstats b{display:block;font:700 17px var(--f-d);color:var(--ink);margin-bottom:6px}
.chhead,.chrow{display:grid;grid-template-columns:1fr repeat(3,48px);align-items:center}
.chhead{font-size:13px;color:var(--ink2);text-align:center;padding-top:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.chhead span:first-child{text-align:left}
.chrow{border-bottom:1px solid var(--line);padding:6px 0;min-height:52px}
.chrow .nm{padding-right:8px;line-height:1.3}
.chrow .bub{justify-self:center}
.nm .x{min-width:28px;min-height:28px;font-size:18px;vertical-align:middle}

.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:86px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.bar span:last-child{text-align:right;font-weight:700}
.chart{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--ink3);font:11px var(--f-b)}
.ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.lab{fill:var(--ink);font:700 13px var(--f-d);text-anchor:middle}
.trow{padding:14px 0;border-bottom:1px solid var(--line)}
.ttop{display:flex;align-items:center;gap:10px}
.tscore{font:800 26px/1 var(--f-d);letter-spacing:-.02em}
.tscore small{font:400 14px var(--f-b);color:var(--ink2);margin-left:3px}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);margin:8px 14px 0 0}
.up{color:var(--ok);font-weight:700}.down{color:var(--red);font-weight:700}

.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--wash);margin:6px 0 10px}
.dist i{background:var(--c)}
.tag{display:inline-block;border:2px solid var(--c);border-radius:6px;padding:0 8px;font-size:12.5px;font-weight:700;line-height:1.5}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.mrow .bub{margin-top:2px}
.mrow.fixed .note{color:var(--ink3)}
.mtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.note{white-space:pre-wrap;word-break:break-word}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.dock nav{display:flex;width:100%;max-width:600px}
.dock button{flex:1;display:grid;justify-items:center;gap:1px;background:none;border:0;color:var(--ink3);font-weight:700;font-size:11.5px;padding:6px 0;cursor:pointer;border-radius:10px}
.dock button[aria-current="page"]{color:var(--accent)}
.dock svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;background:rgba(8,12,28,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--paper);width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet:focus{outline:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.foot{margin-top:34px;font-size:14px;color:var(--ink2)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}

/* ---------- Premium motion + JEE Advanced UI ---------- */
body{overflow-x:hidden;background-color:var(--bg);transition:background-color .45s var(--ease-smooth),color .45s var(--ease-smooth)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 10% 10%,rgba(35,64,200,.10),transparent 28%),radial-gradient(circle at 90% 15%,rgba(139,92,246,.10),transparent 26%),radial-gradient(circle at 55% 95%,rgba(14,159,142,.08),transparent 30%);animation:ambient 14s ease-in-out infinite alternate}
@keyframes ambient{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1%,1%,0) scale(1.035)}}
.wrap{animation:pageIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sec{animation:sectionIn .55s cubic-bezier(.2,.8,.2,1) both}
.sec:nth-child(2){animation-delay:.04s}.sec:nth-child(3){animation-delay:.08s}.sec:nth-child(4){animation-delay:.12s}.sec:nth-child(5){animation-delay:.16s}
@keyframes sectionIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn,.chip,.seg button,.icon,.bub,.stepper button,.dock button,.x{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease,color .18s ease}
.btn:hover,.chip:hover,.seg button:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(19,26,51,.10)}
.icon:hover{transform:rotate(8deg) scale(1.06);background:var(--wash)}
.bub.on{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 13%,transparent)}
.hb{transition:transform .25s ease,filter .25s ease}.hb:hover{transform:translateY(-3px) scale(1.06);filter:brightness(1.05)}
.meter i{position:relative;overflow:hidden}.meter i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.45) 50%,transparent 75%);transform:translateX(-120%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{55%,100%{transform:translateX(120%)}}
.ringwrap{filter:drop-shadow(0 18px 28px rgba(35,64,200,.13))}
.ringwrap .arc{filter:drop-shadow(0 0 5px rgba(35,64,200,.28))}
.adv-hero{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 11%,var(--paper)),var(--paper));border-radius:20px;padding:22px;margin-top:8px;box-shadow:0 18px 45px rgba(35,64,200,.10)}
.adv-hero::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-70px;background:radial-gradient(circle,rgba(35,64,200,.22),transparent 68%);animation:floatOrb 5s ease-in-out infinite}
@keyframes floatOrb{50%{transform:translate(-16px,12px) scale(1.08)}}
.adv-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.adv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.adv-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:color-mix(in srgb,var(--paper) 84%,var(--wash));transition:transform .2s ease,box-shadow .2s ease}.adv-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(19,26,51,.09)}.adv-card b{display:block;font-family:var(--f-d);font-size:17px;margin-bottom:3px}.adv-card span{font-size:12.5px;color:var(--ink2)}
.adv-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 9%,var(--paper));color:var(--accent);padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800}
@media(max-width:520px){.adv-grid{grid-template-columns:1fr}.adv-hero{padding:18px}}
/* Left / Right reveal motion */
.lr-left,.lr-right{opacity:0;will-change:transform,opacity}
.lr-left{transform:translateX(-70px)}
.lr-right{transform:translateX(70px)}
.lr-left.lr-show{animation:lrRevealLeft .72s cubic-bezier(.2,.8,.2,1) forwards}
.lr-right.lr-show{animation:lrRevealRight .72s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes lrRevealLeft{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:translateX(0)}}
@keyframes lrRevealRight{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:translateX(0)}}

/* ---------- Premium product polish ---------- */
:root{
  --ease-premium:cubic-bezier(.16,1,.3,1);
}
.wrap{position:relative}
.top{position:relative;z-index:2}
.hero-shell{position:relative;overflow:hidden;padding:8px 0 2px}
.hero-shell::before{content:"";position:absolute;z-index:-1;width:220px;height:220px;right:-95px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(35,64,200,.12),transparent 68%);animation:heroOrb 8s var(--ease-premium) infinite alternate}
.hero-shell::after{content:"";position:absolute;z-index:-1;width:150px;height:150px;left:-100px;bottom:-90px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.08),transparent 70%);animation:heroOrb 11s var(--ease-premium) infinite alternate-reverse}
@keyframes heroOrb{to{transform:translate3d(18px,10px,0) scale(1.08)}}
.hero-status{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 82%,var(--wash));padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:12px}
.hero-status i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 12%,transparent)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.daily-progress{margin-top:18px;border:1px solid var(--line);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--paper) 86%,var(--wash));box-shadow:0 10px 30px rgba(19,26,51,.05)}
.daily-progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.daily-progress-head b{font:800 15px var(--f-d)}
.daily-progress-head span{font-size:13px;color:var(--ink2)}
.daily-track{height:9px;border-radius:99px;background:var(--wash);overflow:hidden}
.daily-track i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--ok)));transform-origin:left center;transition:transform 1s var(--ease-premium)}
.daily-progress[data-ready="true"] .daily-track i{transform:scaleX(var(--daily-p,0))}
.daily-percent{margin-top:8px;font-size:12px;color:var(--ink2)}
.creator{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:22px;background:linear-gradient(145deg,color-mix(in srgb,var(--paper) 92%,var(--wash)),var(--paper));box-shadow:0 16px 45px rgba(19,26,51,.07);transition:transform .45s var(--ease-premium),box-shadow .45s var(--ease-premium),border-color .3s ease}
.creator::before{content:"";position:absolute;width:130px;height:130px;right:-60px;top:-70px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%);animation:creatorGlow 7s var(--ease-premium) infinite alternate}
@keyframes creatorGlow{to{transform:translate(-12px,15px) scale(1.12)}}
.creator:hover{transform:translateY(-4px);box-shadow:0 22px 55px rgba(19,26,51,.11);border-color:color-mix(in srgb,var(--accent) 28%,var(--line))}
.creator-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:7px}
.creator-name{font:800 clamp(23px,5vw,30px)/1.1 var(--f-d);letter-spacing:-.035em}
.creator-copy{max-width:560px;margin-top:8px;color:var(--ink2)}
.creator-badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800}

<div class="wrap">
  <header class="top" id="top"></header>
  <main id="view"></main>
  <section class="community" id="student-community" aria-labelledby="community-title">
    <div class="community-head"><h2 id="community-title">Student Corner</h2><span class="community-tag">Study together</span></div>
    <p>Share a study tip, ask a general question, or encourage fellow learners.</p>
    <p class="community-note" id="community-status" hidden></p>
    <div class="community-auth" id="community-auth" hidden>
      <button class="btn ghost" id="auth-google" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2.1 1.4-4.7 2.3-7.7 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
      <div class="auth-or">or use email</div>
      <form id="auth-form" novalidate>
        <input id="auth-name" type="text" maxlength="32" autocomplete="nickname" placeholder="Display name" aria-label="Display name" hidden>
        <input id="auth-email" type="email" autocomplete="email" placeholder="Email" aria-label="Email" required>
        <input id="auth-pass" type="password" minlength="6" autocomplete="current-password" placeholder="Password (min 6 characters)" aria-label="Password" required>
        <button class="btn" id="auth-submit" type="submit">Log in</button>
        <div class="auth-links"><button class="link" id="auth-toggle" type="button">New here? Create account</button><button class="link" id="auth-reset" type="button">Forgot password?</button></div>
      </form>
      <p class="auth-msg" id="auth-msg" role="alert" hidden></p>
    </div>
    <div class="community-user" id="community-user" hidden><span>Signed in as <b id="community-who"></b></span><button class="link" id="community-signout" type="button">Sign out</button></div>
    <div class="community-verify" id="community-verify" hidden>Please verify your email to post. We sent a link to <b id="verify-email"></b>.<br><button class="btn sm" id="verify-check" type="button">I've verified</button> <button class="link" id="verify-resend" type="button">Resend email</button></div>
    <form class="community-form" id="community-form" hidden>
      <textarea id="community-message" maxlength="500" placeholder="Write a helpful, respectful comment…" aria-label="Comment" required></textarea>
      <input class="hp-field" id="community-website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="community-actions"><button class="btn" type="submit" id="community-post">Post comment</button><span class="community-note" id="community-count">0/500 · No links, please. One post every 30 seconds.</span></div>
    </form>
    <div class="comment-list" id="comment-list" aria-live="polite"></div>
  </section>
  <footer class="credit">Designed by <b>Shreyansh Singh</b></footer>
</div>
<div class="dock"><nav id="nav" aria-label="Sections"></nav></div><button class="sound-btn" id="sound-toggle" type="button" aria-pressed="false" title="Play gentle white noise">♪ Ambient sound: off</button>
<div class="scrim" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid=function(){return Math.random().toString(36).slice(2,9);};
var pad=function(n){return String(n).padStart(2,'0');};
var DAY=864e5;
var dkey=function(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var sod=function(d){d=d?new Date(d):new Date();d.setHours(0,0,0,0);return d;};
var fmtMin=function(m){m=Math.round(m);var h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):m+'m';};
var fmtDate=function(x){if(typeof x==='string'&&x.length===10)x+='T00:00:00';return new Date(x).toLocaleDateString('en-IN',{day:'numeric',month:'short'});};
var fmtClock=function(ms){var s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);};
var BASE_TITLE=document.title;

/* ---------- Syllabus data ---------- */
var SUB={
 phy:{id:'phy',name:'Physics',short:'Phy',c:'--phy',ch:['Units and measurements','Kinematics','Laws of motion','Work, energy and power','Centre of mass and collisions','Rotational motion','Gravitation','Properties of solids and fluids','Thermodynamics','Kinetic theory of gases','Oscillations','Waves and sound','Electrostatics','Capacitors','Current electricity','Magnetic effects of current','Magnetism and matter','Electromagnetic induction','Alternating current','Electromagnetic waves','Ray optics','Wave optics','Dual nature of radiation','Atoms and nuclei','Semiconductor devices']},
 chem:{id:'chem',name:'Chemistry',short:'Chem',c:'--chem',ch:['Some basic concepts of chemistry','Atomic structure','Periodic table and periodicity','Chemical bonding','States of matter','Chemical thermodynamics','Chemical equilibrium','Ionic equilibrium','Redox reactions','Solutions','Electrochemistry','Chemical kinetics','Hydrogen and s-block elements','p-block elements','d- and f-block elements','Coordination compounds','General organic chemistry','Hydrocarbons','Haloalkanes and haloarenes','Alcohols, phenols and ethers','Aldehydes, ketones and carboxylic acids','Amines','Biomolecules']},
 math:{id:'math',name:'Mathematics',short:'Maths',c:'--math',ch:['Sets and relations','Functions','Complex numbers','Quadratic equations','Sequences and series','Permutations and combinations','Binomial theorem','Matrices','Determinants','Trigonometric ratios and equations','Inverse trigonometric functions','Straight lines','Circles','Parabola','Ellipse and hyperbola','Limits','Continuity and differentiability','Application of derivatives','Indefinite integrals','Definite integrals and area','Differential equations','Vector algebra','Three-dimensional geometry','Probability','Statistics']},
 bot:{id:'bot',name:'Botany',short:'Bot',c:'--bot',ch:['The living world','Biological classification','Plant kingdom','Morphology of flowering plants','Anatomy of flowering plants','Cell: the unit of life','Cell cycle and cell division','Biomolecules','Transport in plants','Mineral nutrition','Photosynthesis','Respiration in plants','Plant growth and development','Sexual reproduction in flowering plants','Principles of inheritance and variation','Molecular basis of inheritance','Biotechnology: principles and processes','Organisms and populations','Ecosystem','Biodiversity and conservation']},
 zoo:{id:'zoo',name:'Zoology',short:'Zoo',c:'--zoo',ch:['Animal kingdom','Structural organisation in animals','Digestion and absorption','Breathing and exchange of gases','Body fluids and circulation','Excretory products and elimination','Locomotion and movement','Neural control and coordination','Chemical coordination and integration','Human reproduction','Reproductive health','Evolution','Human health and disease','Strategies for enhancing food production','Microbes in human welfare']}
};
var EXAMS={
 jee:{name:'JEE Main',total:300,subs:['phy','chem','math']},
 adv:{name:'JEE Advanced',total:300,subs:['phy','chem','math'],advanced:true},
 neet:{name:'NEET',total:720,subs:['phy','chem','bot','zoo']}
};
var TYPES={
 concept:{n:'Concept gap',c:'--t-concept',tip:'Go back to the theory, then solve five fresh problems on it.'},
 calc:{n:'Calculation error',c:'--t-calc',tip:'Write every step and check signs and units before moving on.'},
 silly:{n:'Silly mistake',c:'--t-silly',tip:'Underline what the question asks before you start solving.'},
 time:{n:'Ran out of time',c:'--t-time',tip:'Practise timed sets and skip long questions on the first pass.'},
 guess:{n:'Guessed',c:'--t-guess',tip:'Work out why the right option is right, not just which one it is.'}
};

/* ---------- State ---------- */
var KEY='prepdesk.v1';
var blank=function(){return {examDate:'',goal:6,focusMin:25,subject:'',prog:{},custom:{},sessions:[],tasks:[],tests:[],mistakes:[]};};
function migrate(o){
  var s={exam:'jee',theme:'auto',timer:{mode:'focus',running:false,endAt:0,left:null},d:{}};
  if(o&&typeof o==='object'){
    if(['jee','adv','neet'].indexOf(o.exam)>-1)s.exam=o.exam;
    if(['auto','light','dark'].indexOf(o.theme)>-1)s.theme=o.theme;
    if(o.timer&&typeof o.timer==='object')Object.assign(s.timer,o.timer);
  }
  ['jee','adv','neet'].forEach(function(k){s.d[k]=Object.assign(blank(),(o&&o.d&&o.d[k])||{});});
  return s;
}
var S;
try{S=migrate(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){S=migrate(null);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var D=function(){return S.d[S.exam];};
var E=function(){return EXAMS[S.exam];};
var subs=function(){return E().subs.map(function(id){return SUB[id];});};
var tab='home',sylSub=null,mf={type:'all',status:'open'};

/* ---------- Derived data ---------- */
function chapters(sub){return sub.ch.map(function(n){return {n:n,custom:false};}).concat((D().custom[sub.id]||[]).map(function(n){return {n:n,custom:true};}));}
var pk=function(sid,n){return sid+'|'+n;};
var ps=function(sid,n){return D().prog[pk(sid,n)]||{t:0,p:0,r:0};};
function counts(sub){var c={n:0,t:0,p:0,r:0};chapters(sub).forEach(function(ch){var s=ps(sub.id,ch.n);c.n++;if(s.t)c.t++;if(s.p)c.p++;if(s.r)c.r++;});return c;}
function pct(sub){var c=counts(sub);return c.n?Math.round((c.t+c.p+c.r)/(c.n*3)*100):0;}
function overall(){var n=0,x=0;subs().forEach(function(s){var c=counts(s);n+=c.n*3;x+=c.t+c.p+c.r;});return n?Math.round(x/n*100):0;}
function minsByDay(){var m={};D().sessions.forEach(function(s){var k=dkey(new Date(s.ts));m[k]=(m[k]||0)+s.min;});return m;}
function streak(){var by=minsByDay(),d=new Date(),n=0;if(!by[dkey(d)])d.setDate(d.getDate()-1);while(by[dkey(d)]>0){n++;d.setDate(d.getDate()-1);}return n;}
function weekMins(){var by=minsByDay(),t=0;for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);t+=by[dkey(d)]||0;}return t;}
function todaySessions(){var t=dkey();return D().sessions.filter(function(s){return dkey(new Date(s.ts))===t;}).sort(function(a,b){return b.ts-a.ts;});}
function addSession(min,sub){D().sessions.push({id:uid(),ts:Date.now(),min:min,sub:sub||''});}
function dueRev(){
  var out=[];
  subs().forEach(function(s){chapters(s).forEach(function(c,i){var p=ps(s.id,c.n);if(p.t&&!p.r&&Date.now()-p.t>=7*DAY)out.push({s:s,c:c,i:i,days:Math.floor((Date.now()-p.t)/DAY)});});});
  return out.sort(function(a,b){return b.days-a.days;});
}
function weakest(){var w=null;subs().forEach(function(s){var p=pct(s);if(!w||p<w.p)w={s:s,p:p};});return w;}
var dotc=function(v){return 'style="--c:var('+v+')"';};

/* ---------- Timer ---------- */
var CIRC=2*Math.PI*98,BRK={short:5,long:15};
function totalMs(mode){mode=mode||S.timer.mode;return (mode==='focus'?D().focusMin:BRK[mode])*60000;}
function leftMs(){var t=S.timer;if(t.running)return Math.max(0,t.endAt-Date.now());return t.left==null?totalMs():t.left;}
var AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){
  try{
    unlockAudio();var t=AC.currentTime;
    [0,.25,.5].forEach(function(o,i){var osc=AC.createOscillator(),g=AC.createGain();osc.frequency.value=i===2?880:660;osc.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.2);osc.start(t+o);osc.stop(t+o+.22);});
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}
function completeTimer(){
  var t=S.timer,d=D(),wasFocus=t.mode==='focus';
  t.running=false;t.left=null;
  if(wasFocus){addSession(d.focusMin,d.subject);t.mode=(todaySessions().length%4===0)?'long':'short';toast('Focus session done. Take a break.');}
  else{t.mode='focus';toast('Break over. Start your next session when ready.');}
  save();beep();render();
}
function updTimer(){
  var t=S.timer,T=totalMs(),L=leftMs();
  document.title=t.running?fmtClock(L)+' | PrepDesk':BASE_TITLE;
  if(tab!=='focus')return;
  var c=$('#clock');if(!c)return;
  c.textContent=fmtClock(L);
  $('#arc').style.strokeDashoffset=String(CIRC*(1-L/T));
  $('#tstart').textContent=t.running?'Pause':((t.left==null||t.left>=T)?'Start':'Resume');
  $('#tstop').hidden=!(t.mode==='focus'&&(T-L)>=60000);
}
function tick(){if(S.timer.running&&Date.now()>=S.timer.endAt){completeTimer();return;}updTimer();}

/* ---------- UI helpers ---------- */
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},2600);}
var lastFocus=null;
function openModal(html){lastFocus=document.activeElement;var m=$('#modal');m.innerHTML='<div class="sheet" role="dialog" aria-modal="true" tabindex="-1">'+html+'</div>';m.hidden=false;m.firstChild.focus();}
function closeModal(){var m=$('#modal');m.hidden=true;m.innerHTML='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}}
var onYes=null;
function ask(title,msg,label,fn){onYes=fn;openModal('<h3>'+esc(title)+'</h3><p class="muted">'+esc(msg)+'</p><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn danger" data-act="yes">'+esc(label)+'</button></div>');}
function applyTheme(){var r=document.documentElement;if(S.theme==='auto'){r.removeAttribute('data-theme');r.style.colorScheme='light dark';}else{r.setAttribute('data-theme',S.theme);r.style.colorScheme=S.theme;}}

var ICON={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/>',
 syllabus:'<circle cx="6" cy="8" r="2.5"/><circle cx="12" cy="8" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="6" cy="16" r="2.5"/><circle cx="12" cy="16" r="2.5" fill="currentColor"/><circle cx="18" cy="16" r="2.5"/>',
 tests:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
 mistakes:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>'
};
var TABS=[['home','Home'],['focus','Focus'],['syllabus','Syllabus'],['tests','Tests'],['mistakes','Mistakes']];

function renderChrome(){
  var themeDark=S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  $('#top').innerHTML='<div class="brand"><span class="logo"></span>PrepDesk</div>'+
   '<div class="seg" role="group" aria-label="Choose your exam">'+['jee','adv','neet'].map(function(k){return '<button data-act="exam" data-v="'+k+'" aria-pressed="'+(S.exam===k)+'">'+EXAMS[k].name+'</button>';}).join('')+'</div>'+
   '<button class="theme-switch" data-dark="'+themeDark+'" data-act="theme" aria-label="Switch to '+(themeDark?'light':'dark')+' mode" title="Switch theme"><span class="theme-switch-icon" aria-hidden="true">'+(themeDark?'☀':'☾')+'</span><span class="theme-switch-label">'+(themeDark?'Light':'Dark')+'</span><span class="theme-switch-knob" aria-hidden="true"></span></button>'+
   '<button class="icon" data-act="data" aria-label="Backup and reset"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/></svg></button>';
  $('#nav').innerHTML=TABS.map(function(t){return '<button data-act="tab" data-v="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24">'+ICON[t[0]]+'</svg>'+t[1]+'</button>';}).join('');
}

/* ---------- Views ---------- */
function vHome(){
  var d=D(),e=E(),today=dkey(),tm=(minsByDay()[today]||0),hero;
  if(d.examDate){
    var days=Math.round((sod(d.examDate+'T00:00:00')-sod())/DAY);
    if(days>0)hero='<h1>'+days+' day'+(days===1?'':'s')+' until '+e.name+'.</h1><p class="muted" style="margin-top:8px">About '+Math.max(1,Math.round(days/7))+' week'+(Math.round(days/7)===1?'':'s')+' to go. <button class="link" data-act="setdate">Change date</button></p>';
    else if(days===0)hero='<h1>Today is '+e.name+'.</h1><p class="muted" style="margin-top:8px">Read every question twice. You have prepared for this.</p>';
    else hero='<h1>'+e.name+' is behind you.</h1><p class="muted" style="margin-top:8px">Attempting again? <button class="link" data-act="setdate">Set a new date</button></p>';
  }else hero='<h1>Count down to '+e.name+'.</h1><p class="muted" style="margin:8px 0 12px">Add your exam date to see how many days are left.</p><button class="btn sm" data-act="setdate">Set exam date</button>';

  var advHero=E().advanced?'<div class="adv-hero"><div class="adv-kicker">JEE Advanced mode</div><div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><span class="adv-badge">⚡ Deep problem solving</span><span class="muted sm">Build depth, not just speed</span></div><h2 style="margin-top:9px">Train like an Advanced problem solver.</h2><p class="muted" style="margin-top:6px">Prioritise multi-concept questions, rigorous reasoning, clean calculations and post-test error analysis.</p><div class="adv-grid"><div class="adv-card"><b>Concept depth</b><span>Connect 2–3 ideas before calculating.</span></div><div class="adv-card"><b>Hard sets</b><span>Mix timed and untimed challenging problems.</span></div><div class="adv-card"><b>Mistake loop</b><span>Re-solve errors without looking at the solution.</span></div></div><div style="margin-top:15px"><button class="btn" data-act="tab" data-v="mistakes">Open Advanced mistake loop</button></div></div>':'';
  var hb='';for(var i=0;i<d.goal;i++){hb+='<span class="hb" style="--f:'+Math.max(0,Math.min(1,tm/60-i)).toFixed(2)+'"></span>';}
  var goalMin=d.goal*60;
  var msg=tm>=goalMin?'<span class="pill">Goal reached</span> Anything extra is a bonus.':fmtMin(tm)+' done, '+fmtMin(goalMin-tm)+' to go.';

  var tasks=d.tasks.filter(function(t){return !t.done||t.date===today;});
  var tl=tasks.map(function(t){return '<li class="row'+(t.done?' done':'')+'"><button class="bub sm'+(t.done?' on':'')+'" role="checkbox" aria-checked="'+t.done+'" aria-label="Mark done: '+esc(t.text)+'" data-act="task" data-id="'+t.id+'"></button><span class="grow">'+esc(t.text)+'</span><button class="x" data-act="del-task" data-id="'+t.id+'" aria-label="Delete task">\u00d7</button></li>';}).join('');
  var anyDone=d.tasks.some(function(t){return t.done;});

  var w=weakest(),nx;
  if(overall()===0)nx='<p class="muted">Mark the chapters you have already covered in the Syllabus tab. This space will then point you to your weakest subject.</p>';
  else nx='<p><b>'+w.s.name+'</b> is your least covered subject at '+w.p+'%.</p><div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" data-act="go-syl" data-v="'+w.s.id+'">Open '+w.s.name+' syllabus</button></div>';

  var due=dueRev(),dl=due.slice(0,5).map(function(x){return '<li class="row"><i class="dot" '+dotc(x.s.c)+'></i><div class="grow"><b>'+esc(x.c.n)+'</b><div class="muted sm">'+x.s.name+', theory finished '+x.days+' days ago</div></div><button class="btn sm ghost" data-act="mark-r" data-s="'+x.s.id+'" data-i="'+x.i+'">Revised</button></li>';}).join('');

  var goalMin=d.goal*60,pctDay=Math.min(1,goalMin?tm/goalMin:0);
  var status=E().advanced?'Advanced mode · deep work':'Ready for focused preparation';
  var advancedDecor=E().advanced?'<span class="math-float math-a">∑ f(x)</span><span class="math-float math-b">Δp = FΔt</span><span class="math-float math-c">∇·E</span>':'';
  var heroWrap='<section class="sec first hero-shell"><div class="hero-status"><i></i>'+status+'</div><div class="hero-content">'+hero+'</div>'+advHero+
    '<div class="hero-actions"><button class="btn magnetic" data-act="tab" data-v="focus">Start focus</button><button class="btn ghost" data-act="tab" data-v="syllabus">Open syllabus</button></div>'+
    '<div class="stats"><div><b>'+streak()+'</b><span>day streak</span></div><div><b>'+overall()+'%</b><span>syllabus done</span></div><div><b>'+fmtMin(weekMins())+'</b><span>last 7 days</span></div></div>'+advancedDecor+'</section>';
  var daily='<div class="daily-progress scroll-reveal" data-daily-p="'+pctDay.toFixed(3)+'"><div class="daily-progress-head"><b>Daily progress</b><span>'+fmtMin(tm)+' / '+fmtMin(goalMin)+'</span></div><div class="daily-track" aria-hidden="true"><i></i></div><div class="daily-percent">'+Math.round(pctDay*100)+'% of today’s goal completed</div></div>';
  return heroWrap+
   '<section class="sec"><div class="sec-h"><h2>Today</h2><div class="stepper"><button data-act="goal" data-v="-1" aria-label="Lower daily goal">\u2212</button><span>'+d.goal+'h goal</span><button data-act="goal" data-v="1" aria-label="Raise daily goal">+</button></div></div>'+
   '<div class="hbs" role="img" aria-label="'+fmtMin(tm)+' studied of a '+d.goal+' hour goal">'+hb+'</div><p class="muted">'+msg+' Each bubble is one hour.</p>'+daily+
   '<div style="margin-top:14px"><button class="btn magnetic" data-act="tab" data-v="focus">Start a focus session</button></div></section>'+
   '<section class="sec"><div class="sec-h"><h2>Tasks</h2>'+(anyDone?'<button class="link" data-act="clear-done">Clear done</button>':'')+'</div>'+
   '<div class="add"><input id="taskIn" maxlength="120" placeholder="e.g. Solve 20 kinematics PYQs" aria-label="New task"><button class="btn" data-act="add-task">Add</button></div>'+
   (tl?'<ul class="list">'+tl+'</ul>':'<p class="empty">No tasks yet. Add the three things that would make today a good day.</p>')+'</section>'+

function heat(){
  var by=minsByDay(),t0=sod(),dow=(t0.getDay()+6)%7,start=new Date(t0),h='',tk=dkey(t0);
  start.setDate(start.getDate()-dow-77);
  for(var i=0;i<84;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);
    var k=dkey(d),m=by[k]||0,fut=d>t0,l=0;
    if(m>0)l=1;if(m>=60)l=2;if(m>=180)l=3;if(m>=300)l=4;
    h+='<i class="hc '+(fut?'fut':'l'+l)+(k===tk?' now':'')+'" title="'+fmtDate(d)+': '+fmtMin(m)+'"></i>';
  }
  return h;
}

function chartSVG(tests,max){
  var W=340,H=190,pl=34,pr=16,pt=22,pb=26;
  var ts=tests.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts;});
  var vals=ts.map(function(t){return t.total;}),step=max/6;
  var lo=Math.max(0,Math.floor((Math.min.apply(null,vals)-max*.1)/step)*step);lo=Math.min(lo,Math.floor(Math.min.apply(null,vals)));if(lo>=max)lo=0;
  var x=function(i){return pl+(ts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(ts.length-1));};
  var y=function(v){return pt+(1-(v-lo)/(max-lo))*(H-pt-pb);};
  var g='';for(var k=0;k<4;k++){var v=lo+(max-lo)*k/3;g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>';}
  var path=ts.map(function(t,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(t.total).toFixed(1);}).join(' ');
  var pts=ts.map(function(t,i){return '<circle class="pt" cx="'+x(i).toFixed(1)+'" cy="'+y(t.total).toFixed(1)+'" r="'+(i===ts.length-1?7:5)+'"/>';}).join('');
  var last=ts[ts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart of your mock test totals over time">'+g+(ts.length>1?'<path class="ln" d="'+path+'"/>':'')+pts+
   '<text class="lab" x="'+Math.min(W-pr-12,Math.max(pl+12,x(ts.length-1)))+'" y="'+(y(last.total)-12)+'">'+last.total+'</text>'+
   '<text class="ax" x="'+pl+'" y="'+(H-6)+'">'+fmtDate(ts[0].date)+'</text>'+(ts.length>1?'<text class="ax" x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+fmtDate(last.date)+'</text>':'')+'</svg>';
}

   '<section class="sec"><div class="sec-h"><h2>History</h2></div><ul class="list">'+tests.map(function(t){return '<li class="trow"><div class="ttop"><div class="grow"><b>'+esc(t.name)+'</b><div class="muted sm">'+fmtDate(t.date)+'</div></div><div class="tscore">'+t.total+'<small>/'+e.total+'</small></div><button class="x" data-act="del-test" data-id="'+t.id+'" aria-label="Delete test">\u00d7</button></div><div>'+e.subs.map(function(id){return '<span class="mini"><i class="dot" '+dotc(SUB[id].c)+'></i>'+SUB[id].short+' '+(t.marks[id]!=null?t.marks[id]:'-')+'</span>';}).join('')+'</div></li>';}).join('')+'</ul></section>';

function render(direction){

  var paint=function(){
    v.innerHTML=({home:vHome,focus:vFocus,syllabus:vSyl,tests:vTests,mistakes:vMist})[tab]();
    v.classList.remove('page-transition-out');
    v.style.setProperty('--page-x',(direction>0?'14px':'-14px'));
    v.classList.add('page-transition-in');
    window.setTimeout(function(){v.classList.remove('page-transition-in');v.style.removeProperty('--page-x');},520);

}

 'add-task':function(){var i=$('#taskIn'),v=(i.value||'').trim();if(!v){i.focus();return;}D().tasks.push({id:uid(),text:v,done:false,date:dkey()});save();render();var n=$('#taskIn');if(n)n.focus();},
 task:function(v,id){var t=D().tasks.filter(function(x){return x.id===id;})[0];if(t){t.done=!t.done;t.date=dkey();save();render();}},
 'del-task':function(v,id){D().tasks=D().tasks.filter(function(x){return x.id!==id;});save();render();},

 'mark-r':function(v,id,el){var s=SUB[el.dataset.s],c=chapters(s)[Number(el.dataset.i)],k=pk(s.id,c.n),p=D().prog[k]||(D().prog[k]={t:0,p:0,r:0});p.r=Date.now();save();render();toast('Marked as revised');},
 tstart:function(){var t=S.timer;if(t.running){t.left=Math.max(0,t.endAt-Date.now());t.running=false;}else{var l=leftMs();t.endAt=Date.now()+l;t.running=true;unlockAudio();}save();render();},

 'del-sess':function(v,id){D().sessions=D().sessions.filter(function(x){return x.id!==id;});save();render();},
 sylsub:function(v){sylSub=v;render();},

 'del-ch':function(v,id,el){var s=SUB[el.dataset.s],c=chapters(s)[Number(el.dataset.i)];if(!c||!c.custom)return;D().custom[s.id]=D().custom[s.id].filter(function(n){return n!==c.n;});delete D().prog[pk(s.id,c.n)];save();render();},
 'add-test':modalTest,

 'add-m':modalMist,

 mfix:function(v,id){var m=D().mistakes.filter(function(x){return x.id===id;})[0];if(m){m.fixed=!m.fixed;save();render();}},

function initMotion(){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sections=document.querySelectorAll('#view .sec');
  sections.forEach(function(el,i){el.classList.add('scroll-reveal',i%2?'from-right':'from-left');});
  var hero=document.querySelector('#view .first');
  if(hero)hero.classList.add('hero-stagger');
  var targets=document.querySelectorAll('#view .scroll-reveal, #view .hero-stagger');
  if(reduce){targets.forEach(function(x){x.classList.add('is-visible');});}
  else if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target);}});},{threshold:.12,rootMargin:'0px 0px -8% 0px'});
    targets.forEach(function(x){io.observe(x);});
  }else targets.forEach(function(x){x.classList.add('is-visible');});
  document.querySelectorAll('.meter i[style*="width"]').forEach(function(bar){
    var m=(bar.getAttribute('style')||'').match(/width\s*:\s*([^;]+)/);
    if(m){bar.style.setProperty('--progress',m[1]);bar.removeAttribute('style');bar.setAttribute('data-progress','1');}
  });
  var fills=document.querySelectorAll('.meter i[data-progress]');
  if(reduce)fills.forEach(function(x){x.classList.add('is-filled');});
  else if('IntersectionObserver' in window){var pi=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-filled');pi.unobserve(e.target);}});},{threshold:.2});fills.forEach(function(x){pi.observe(x);});}
  else fills.forEach(function(x){x.classList.add('is-filled');});
  document.querySelectorAll('.daily-progress').forEach(function(card){
    card.style.setProperty('--daily-p',card.dataset.dailyP||'0');
    requestAnimationFrame(function(){card.dataset.ready='true';});
  });
  document.querySelectorAll('.btn:not(.ghost),.btn.big,.adv-card').forEach(function(el){if(!el.classList.contains('magnetic')&&!el.closest('.dock'))el.classList.add('magnetic');});
}
function initMagnetic(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.magnetic').forEach(function(el){
    if(el.dataset.magneticReady)return;el.dataset.magneticReady='1';
    el.addEventListener('pointermove',function(e){var r=el.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/r.width,y=(e.clientY-r.top-r.height/2)/r.height;el.style.transform='translate3d('+x*8+'px,'+y*6+'px,0)';});
    el.addEventListener('pointerleave',function(){el.style.transform='';});
  });
}
var _renderMotion=render;render=function(){_renderMotion();requestAnimationFrame(function(){initMotion();initMagnetic();});};
render();tick();setInterval(tick,500);
})();
</script>

<script>
(function(){
  'use strict';
  var orb=document.getElementById('pointer-orb');
  var fine=window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(orb&&fine&&!reduce){var x=-100,y=-100,tx=x,ty=y,active=false;
    window.addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;active=true;orb.classList.add('visible')},{passive:true});
    window.addEventListener('pointerleave',function(){active=false;orb.classList.remove('visible')});
    document.addEventListener('pointerover',function(e){orb.classList.toggle('hover',!!e.target.closest('a,button,input,textarea,[role=button]'))});
    (function frame(){x+=(tx-x)*.22;y+=(ty-y)*.22;orb.style.left=x+'px';orb.style.top=y+'px';requestAnimationFrame(frame)})();
  }
  // Soft, low-volume noise starts only after an explicit tap/click.
  var btn=document.getElementById('sound-toggle'),ctx=null,source=null,gain=null,filter=null,playing=false;
  function stop(){if(source){try{source.stop()}catch(e){}source=null}if(ctx){ctx.close().catch(function(){});ctx=null}playing=false;btn.setAttribute('aria-pressed','false');btn.textContent='♪ Ambient sound: off'}
  btn.addEventListener('click',function(){if(playing){stop();return}var AC=window.AudioContext||window.webkitAudioContext;if(!AC){btn.textContent='Sound unavailable';return}
    try{ctx=new AC();var length=ctx.sampleRate*2,buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);var last=0;for(var i=0;i<length;i++){var white=Math.random()*2-1;last=(last+.025*white)/1.025;data[i]=last*3.5}
      source=ctx.createBufferSource();source.buffer=buffer;source.loop=true;filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1800;gain=ctx.createGain();gain.gain.value=.035;source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);source.start();playing=true;btn.setAttribute('aria-pressed','true');btn.textContent='♪ Ambient sound: on';
    }catch(e){stop();btn.textContent='Sound unavailable'}
  });
})();
</script>

<script type="module">
/* ===== PrepDesk Student Corner · Firebase Auth + Firestore =====
   1) Firebase Console > Project settings > Your apps > Web app > copy config below.
   2) Publish firestore.rules (Firestore > Rules).  3) Enable Google + Email/Password in Authentication. */
const firebaseConfig = {
  apiKey: "AIzaSyB_N01ZDwhMCuL-TvBl6pWDuVrw_60fvmE",
  authDomain: "prepdesk-bd58a.firebaseapp.com",
  projectId: "prepdesk-bd58a",
  storageBucket: "prepdesk-bd58a.firebasestorage.app",
  messagingSenderId: "76142149771",
  appId: "1:76142149771:web:5a830d49ab9ccc4771148e"
};
const APP_CHECK_SITE_KEY = ""; // optional: reCAPTCHA v3 site key for Firebase App Check (extra bot protection)

const $ = id => document.getElementById(id);
const status = $('community-status'), authBox = $('community-auth'), userBox = $('community-user'),
      verifyBox = $('community-verify'), postForm = $('community-form'), listEl = $('comment-list');
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COOLDOWN_MS = 30000;

function setStatus(t){ status.textContent = t; status.hidden = !t; }
function authMsg(t, ok){ const m=$('auth-msg'); m.textContent=t||''; m.hidden=!t; m.classList.toggle('ok', !!ok); }
function friendly(e){
  const c = (e && e.code) || '';
  if (c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return 'Email or password is incorrect.';
  if (c.includes('email-already-in-use')) return 'This email already has an account. Try logging in.';
  if (c.includes('weak-password')) return 'Password must be at least 6 characters.';
  if (c.includes('invalid-email')) return 'Please enter a valid email.';
  if (c.includes('too-many-requests')) return 'Too many attempts. Please wait a few minutes.';
  if (c.includes('popup-closed')||c.includes('cancelled-popup')) return '';
  if (c.includes('network')) return 'Network problem. Check your connection.';
  return 'Something went wrong. Please try again.';
}

if (firebaseConfig.apiKey.startsWith('YOUR_')) {
  setStatus('Student Corner is almost ready: add your Firebase config in the page to turn on login and shared comments.');
} else try {
  const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const AU = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const FS = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

  const app = A.initializeApp(firebaseConfig);
  if (APP_CHECK_SITE_KEY) {
    const AC = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js');
    AC.initializeAppCheck(app, { provider: new AC.ReCaptchaV3Provider(APP_CHECK_SITE_KEY), isTokenAutoRefreshEnabled: true });
  }
  const auth = AU.getAuth(app), db = FS.getFirestore(app);
  let mode = 'login', lastSent = '';

  // ----- Shared comments (live for every visitor) -----
  const HIDE_AT = 3;                     // comments with 3+ reports are hidden from regular users
  let docs = [], isAdmin = false;
  const reported = new Set(); try { (JSON.parse(localStorage.getItem('pd_reported')||'[]')).forEach(x => reported.add(x)); } catch(_){}
  function renderList(){
    const me = auth.currentUser && auth.currentUser.uid;
    const html = docs.map(d => {
      const c = d.data({serverTimestamps:'estimate'}), n = c.reportCount || 0, mine = me && c.uid === me;
      if (n >= HIDE_AT && !isAdmin) return '';
      const t = c.createdAt && c.createdAt.toDate ? c.createdAt.toDate().toLocaleDateString() : '';
      let acts = '';
      if (mine || isAdmin) acts += '<button class="link comment-del" data-del="'+esc(d.id)+'" type="button">Delete</button>';
      if (me && !mine && auth.currentUser.emailVerified) acts += reported.has(d.id)
        ? '<span class="comment-flag">Reported</span>'
        : '<button class="link comment-del" data-report="'+esc(d.id)+'" type="button">Report</button>';
      const flag = isAdmin && n ? '<span class="comment-flag">'+n+' report'+(n>1?'s':'')+'</span>' : '';
      return '<article class="comment'+(n>=HIDE_AT?' flagged':'')+'"><strong>'+esc(c.name||'Student')+'</strong><time>'+esc(t)+'</time>'+acts+flag+'<div>'+esc(c.message)+'</div></article>';
    }).join('');
    listEl.innerHTML = html || '<p class="community-note">No comments yet. Start a positive study conversation.</p>';
  }
  const q = FS.query(FS.collection(db,'comments'), FS.orderBy('createdAt','desc'), FS.limit(30));
  FS.onSnapshot(q, snap => { docs = snap.docs; renderList(); },
    () => { listEl.innerHTML = '<p class="community-note">Comments could not be loaded right now.</p>'; });

  listEl.addEventListener('click', async e => {
    const del = e.target.closest('[data-del]'), rep = e.target.closest('[data-report]');
    if (del) {
      if (!confirm('Delete this comment?')) return;
      try { await FS.deleteDoc(FS.doc(db,'comments',del.dataset.del)); } catch(_) { setStatus('Could not delete that comment.'); }
    } else if (rep) {
      const u = auth.currentUser, id = rep.dataset.report; if (!u) return;
      if (!confirm('Report this comment as inappropriate or spam?')) return;
      try {
        const batch = FS.writeBatch(db);
        batch.set(FS.doc(db,'reports', id+'_'+u.uid), { commentId:id, uid:u.uid, createdAt:FS.serverTimestamp() });
        batch.update(FS.doc(db,'comments',id), { reportCount: FS.increment(1) });
        await batch.commit();
        setStatus('Thanks, we will review this comment.');
      } catch (err) { setStatus('You have already reported this comment.'); }
      reported.add(id); try { localStorage.setItem('pd_reported', JSON.stringify([...reported].slice(-200))); } catch(_){}
      renderList();
    }
  });

  // ----- Auth UI state -----
  AU.onAuthStateChanged(auth, user => {
    setStatus('');
    authBox.hidden = !!user; userBox.hidden = !user;
    const verified = !!user && user.emailVerified;
    verifyBox.hidden = !user || verified;
    postForm.hidden = !verified;
    if (user) {
      $('community-who').textContent = user.displayName || user.email;
      $('verify-email').textContent = user.email || '';
    }
    isAdmin = false; renderList();
    if (user) FS.getDoc(FS.doc(db,'admins',user.uid)).then(d => { isAdmin = d.exists(); renderList(); }).catch(() => {});
  });

  function setMode(m){
    mode = m; const signup = m === 'signup';
    $('auth-name').hidden = !signup;
    $('auth-name').required = signup;
    $('auth-pass').autocomplete = signup ? 'new-password' : 'current-password';
    $('auth-submit').textContent = signup ? 'Create account' : 'Log in';
    $('auth-toggle').textContent = signup ? 'Already have an account? Log in' : 'New here? Create account';
    authMsg('');
  }
  $('auth-toggle').onclick = () => setMode(mode === 'login' ? 'signup' : 'login');

  $('auth-google').onclick = async () => {
    authMsg('');
    const p = new AU.GoogleAuthProvider();
    try { await AU.signInWithPopup(auth, p); }
    catch (e) {
      if (e.code === 'auth/popup-blocked') { try { await AU.signInWithRedirect(auth, p); } catch(e2){ authMsg(friendly(e2)); } }
      else authMsg(friendly(e));
    }
  };

  $('auth-form').addEventListener('submit', async e => {
    e.preventDefault(); authMsg('');
    const email = $('auth-email').value.trim(), pass = $('auth-pass').value;
    if (!email || !pass) return;
    $('auth-submit').disabled = true;
    try {
      if (mode === 'signup') {
        const name = $('auth-name').value.trim().slice(0,32);
        if (name.length < 2) { authMsg('Please enter a display name (2+ characters).'); return; }
        const cred = await AU.createUserWithEmailAndPassword(auth, email, pass);
        await AU.updateProfile(cred.user, { displayName: name });
        await AU.sendEmailVerification(cred.user);
        $('community-who').textContent = name;
        authMsg('Account created. Check your inbox to verify your email.', true);
      } else {
        await AU.signInWithEmailAndPassword(auth, email, pass);
      }
    } catch (err) { authMsg(friendly(err)); }
    finally { $('auth-submit').disabled = false; }
  });

  $('auth-reset').onclick = async () => {
    const email = $('auth-email').value.trim();
    if (!email) { authMsg('Type your email above first.'); return; }
    try { await AU.sendPasswordResetEmail(auth, email); authMsg('Password reset email sent (check spam too).', true); }
    catch (e) { authMsg(friendly(e)); }
  };

  $('community-signout').onclick = () => AU.signOut(auth);
  $('verify-resend').onclick = async () => {
    try { await AU.sendEmailVerification(auth.currentUser); setStatus('Verification email sent.'); } catch(e){ setStatus('Please wait a bit before resending.'); }
  };
  $('verify-check').onclick = async () => {
    const u = auth.currentUser; if (!u) return;
    await u.reload(); await u.getIdToken(true);       // refresh token so rules see email_verified
    if (u.emailVerified) { verifyBox.hidden = true; postForm.hidden = false; setStatus(''); }
    else setStatus('Not verified yet. Open the link in your email, then tap again.');
  };

  const ta = $('community-message');
  ta.addEventListener('input', () => { $('community-count').textContent = ta.value.length+'/500 · No links, please. One post every 30 seconds.'; });

  // ----- Posting (client-side spam checks + server-enforced rules) -----
  postForm.addEventListener('submit', async e => {
    e.preventDefault();
    const u = auth.currentUser; if (!u || !u.emailVerified) return;
    if ($('community-website').value) return;                       // honeypot: bots fill hidden fields
    const msg = ta.value.replace(/\s+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
    if (msg.length < 2) { setStatus('Write a little more before posting.'); return; }
    if (/https?:\/\/|www\./i.test(msg)) { setStatus('Links are not allowed in comments.'); return; }
    if (/(.)\1{9,}/.test(msg)) { setStatus('That looks like spam. Please rephrase.'); return; }
    if (msg === lastSent) { setStatus('You already posted that.'); return; }
    let last = 0; try { last = +localStorage.getItem('pd_last_post_'+u.uid) || 0; } catch(_){}
    const wait = COOLDOWN_MS - (Date.now() - last);
    if (wait > 0) { setStatus('Please wait '+Math.ceil(wait/1000)+'s before posting again.'); return; }

    $('community-post').disabled = true;
    try {
      const batch = FS.writeBatch(db);
      const stamp = FS.serverTimestamp();
      batch.set(FS.doc(db,'users',u.uid), { lastPostAt: stamp });  // server-side cooldown marker
      batch.set(FS.doc(FS.collection(db,'comments')), {
        uid: u.uid,
        name: (u.displayName || (u.email||'Student').split('@')[0]).slice(0,32),
        message: msg,
        createdAt: stamp,
        reportCount: 0
      });
      await batch.commit();
      lastSent = msg; ta.value = ''; setStatus('');
      $('community-count').textContent = '0/500 · No links, please. One post every 30 seconds.';
      try { localStorage.setItem('pd_last_post_'+u.uid, String(Date.now())); } catch(_){}
    } catch (err) {
      setStatus(err && err.code === 'permission-denied'
        ? 'Could not post. Please wait 30 seconds between comments and make sure your email is verified.'
        : 'Could not post right now. Please try again.');
    } finally { $('community-post').disabled = false; }
  });
} catch (err) {
  console.error(err);
  setStatus('Student Corner could not connect right now. The rest of PrepDesk works normally.');
}
</script>
