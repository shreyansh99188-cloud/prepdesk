<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PrepDesk: JEE and NEET study planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FB; --paper:#FFFFFF; --ink:#131A33; --ink2:#4A5478; --ink3:#7A85A6; --line:#D9DFEE; --wash:#E7ECF8;
  --accent:#2340C8; --on-accent:#FFFFFF; --hi:#FFE45C; --red:#C93342; --on-red:#FFFFFF; --ok:#17835A;
  --phy:#3B6CF6; --chem:#0E9F8E; --math:#8B5CF6; --bot:#64A82F; --zoo:#E98A15;
  --t-concept:#8B5CF6; --t-calc:#3B6CF6; --t-silly:#E98A15; --t-time:#D6409F; --t-guess:#7A85A6;
  --f-d:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-b:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --paper:#121A33; --ink:#E8ECFA; --ink2:#AAB3D2; --ink3:#7C87AE; --line:#26315C; --wash:#19234A;
    --accent:#8FA5FF; --on-accent:#0B1020; --red:#FF7C88; --on-red:#2A0509; --ok:#4FD69C;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --paper:#121A33; --ink:#E8ECFA; --ink2:#AAB3D2; --ink3:#7C87AE; --line:#26315C; --wash:#19234A;
  --accent:#8FA5FF; --on-accent:#0B1020; --red:#FF7C88; --on-red:#2A0509; --ok:#4FD69C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-b);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;letter-spacing:-.02em}
h1{font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1.04}
h2{font-weight:700;font-size:21px;line-height:1.2}
h3{font-weight:700;font-size:22px;margin-bottom:8px}
h4{font-weight:700;font-size:16px;margin:18px 0 6px}
p{margin:0}
.muted{color:var(--ink2)} .sm{font-size:14px} .grow{flex:1;min-width:0}

.wrap{max-width:680px;margin:0 auto;padding:12px 20px 140px}
.top{display:flex;align-items:center;gap:8px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:9px;font:800 21px var(--f-d);letter-spacing:-.03em;margin-right:auto}
.logo{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent);position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;cursor:pointer;min-height:36px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.sec{padding-top:26px;margin-top:26px;border-top:1px solid var(--line)}
.sec.first{border-top:0;margin-top:0;padding-top:6px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h+.muted{margin:-6px 0 14px}

.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;min-height:44px;cursor:pointer}
.btn.sm{padding:7px 14px;min-height:40px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--red);color:var(--on-red)}
.btn.big{min-width:140px;font-size:17px;min-height:52px;border-radius:14px}
.btn:active{transform:translateY(1px)}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:88px}
.add{display:flex;gap:10px;margin-bottom:6px}
.add .btn{flex:none}
.field{display:grid;gap:6px;margin:0 0 14px;font-weight:700;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin-top:6px}

.stats{display:flex;margin-top:22px}
.stats>div{flex:1;padding:0 14px;border-left:1px solid var(--line)}
.stats>div:first-child{padding-left:0;border-left:0}
.stats b{display:block;font:800 23px/1.15 var(--f-d);letter-spacing:-.02em}
.stats span{color:var(--ink2);font-size:13px}
.pill{display:inline-block;background:var(--hi);color:#131A33;font-weight:700;border-radius:99px;padding:1px 10px;font-size:13px}

/* OMR bubbles: the one signature element */
.bub{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink3);background:transparent;color:var(--ink3);font:700 12px/1 var(--f-d);display:inline-grid;place-items:center;padding:0;cursor:pointer;position:relative;transition:background .15s,border-color .15s,color .15s}
.bub::after{content:"";position:absolute;inset:-8px}
.bub.on{background:var(--accent);border-color:var(--accent);color:transparent;animation:pop .2s}
.bub.sm{width:26px;height:26px;flex:none}
@keyframes pop{50%{transform:scale(1.2)}}
.hbs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.hb{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink3);background:conic-gradient(var(--accent) calc(var(--f) * 360deg),transparent 0)}
.stepper{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:18px;line-height:1;cursor:pointer}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row.done .grow{color:var(--ink3);text-decoration:line-through}
.x{background:none;border:0;color:var(--ink3);font-size:22px;line-height:1;min-width:40px;min-height:40px;cursor:pointer}
.empty{color:var(--ink2);padding:6px 0 4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}

.heat{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-rows:repeat(7,auto);gap:4px}
.hc{display:block;aspect-ratio:1;border-radius:50%;background:var(--wash)}
.hc.l1,.hc.l2,.hc.l3,.hc.l4{background:var(--accent)}
.hc.l1{opacity:.25}.hc.l2{opacity:.5}.hc.l3{opacity:.75}
.hc.fut{background:transparent;border:1px dashed var(--line)}
.hc.now{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:13px;color:var(--ink2)}
.legend .hc{width:12px;height:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:700;opacity:.75}

.ringwrap{position:relative;width:min(76vw,290px);margin:20px auto 16px}
.ring{width:100%;display:block;transform:rotate(-90deg)}
.track{fill:none;stroke:var(--wash);stroke-width:12}
.arc{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ringwrap.brk .arc{stroke:var(--ok)}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px}
.clock{font:800 clamp(48px,14vw,66px)/1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.center{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;font-weight:700}

.meter{height:8px;border-radius:99px;background:var(--wash);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .3s}
.sstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:4px 0 6px}
.sstats div{font-size:13px;color:var(--ink2)}
.sstats b{display:block;font:700 17px var(--f-d);color:var(--ink);margin-bottom:6px}
.chhead,.chrow{display:grid;grid-template-columns:1fr repeat(3,48px);align-items:center}
.chhead{font-size:13px;color:var(--ink2);text-align:center;padding-top:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.chhead span:first-child{text-align:left}
.chrow{border-bottom:1px solid var(--line);padding:6px 0;min-height:52px}
.chrow .nm{padding-right:8px;line-height:1.3}
.chrow .bub{justify-self:center}
.nm .x{min-width:28px;min-height:28px;font-size:18px;vertical-align:middle}

.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:86px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.bar span:last-child{text-align:right;font-weight:700}
.chart{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--ink3);font:11px var(--f-b)}
.ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.lab{fill:var(--ink);font:700 13px var(--f-d);text-anchor:middle}
.trow{padding:14px 0;border-bottom:1px solid var(--line)}
.ttop{display:flex;align-items:center;gap:10px}
.tscore{font:800 26px/1 var(--f-d);letter-spacing:-.02em}
.tscore small{font:400 14px var(--f-b);color:var(--ink2);margin-left:3px}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);margin:8px 14px 0 0}
.up{color:var(--ok);font-weight:700}.down{color:var(--red);font-weight:700}

.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--wash);margin:6px 0 10px}
.dist i{background:var(--c)}
.tag{display:inline-block;border:2px solid var(--c);border-radius:6px;padding:0 8px;font-size:12.5px;font-weight:700;line-height:1.5}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.mrow .bub{margin-top:2px}
.mrow.fixed .note{color:var(--ink3)}
.mtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.note{white-space:pre-wrap;word-break:break-word}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.dock nav{display:flex;width:100%;max-width:600px}
.dock button{flex:1;display:grid;justify-items:center;gap:1px;background:none;border:0;color:var(--ink3);font-weight:700;font-size:11.5px;padding:6px 0;cursor:pointer;border-radius:10px}
.dock button[aria-current="page"]{color:var(--accent)}
.dock svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;background:rgba(8,12,28,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--paper);width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet:focus{outline:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.foot{margin-top:34px;font-size:14px;color:var(--ink2)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<div class="dock"><nav id="nav" aria-label="Sections"></nav></div>
<div class="scrim" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid=function(){return Math.random().toString(36).slice(2,9);};
var pad=function(n){return String(n).padStart(2,'0');};
var DAY=864e5;
var dkey=function(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var sod=function(d){d=d?new Date(d):new Date();d.setHours(0,0,0,0);return d;};
var fmtMin=function(m){m=Math.round(m);var h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):m+'m';};
var fmtDate=function(x){if(typeof x==='string'&&x.length===10)x+='T00:00:00';return new Date(x).toLocaleDateString('en-IN',{day:'numeric',month:'short'});};
var fmtClock=function(ms){var s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);};
var BASE_TITLE=document.title;

/* ---------- Syllabus data ---------- */
var SUB={
 phy:{id:'phy',name:'Physics',short:'Phy',c:'--phy',ch:['Units and measurements','Kinematics','Laws of motion','Work, energy and power','Centre of mass and collisions','Rotational motion','Gravitation','Properties of solids and fluids','Thermodynamics','Kinetic theory of gases','Oscillations','Waves and sound','Electrostatics','Capacitors','Current electricity','Magnetic effects of current','Magnetism and matter','Electromagnetic induction','Alternating current','Electromagnetic waves','Ray optics','Wave optics','Dual nature of radiation','Atoms and nuclei','Semiconductor devices']},
 chem:{id:'chem',name:'Chemistry',short:'Chem',c:'--chem',ch:['Some basic concepts of chemistry','Atomic structure','Periodic table and periodicity','Chemical bonding','States of matter','Chemical thermodynamics','Chemical equilibrium','Ionic equilibrium','Redox reactions','Solutions','Electrochemistry','Chemical kinetics','Hydrogen and s-block elements','p-block elements','d- and f-block elements','Coordination compounds','General organic chemistry','Hydrocarbons','Haloalkanes and haloarenes','Alcohols, phenols and ethers','Aldehydes, ketones and carboxylic acids','Amines','Biomolecules']},
 math:{id:'math',name:'Mathematics',short:'Maths',c:'--math',ch:['Sets and relations','Functions','Complex numbers','Quadratic equations','Sequences and series','Permutations and combinations','Binomial theorem','Matrices','Determinants','Trigonometric ratios and equations','Inverse trigonometric functions','Straight lines','Circles','Parabola','Ellipse and hyperbola','Limits','Continuity and differentiability','Application of derivatives','Indefinite integrals','Definite integrals and area','Differential equations','Vector algebra','Three-dimensional geometry','Probability','Statistics']},
 bot:{id:'bot',name:'Botany',short:'Bot',c:'--bot',ch:['The living world','Biological classification','Plant kingdom','Morphology of flowering plants','Anatomy of flowering plants','Cell: the unit of life','Cell cycle and cell division','Biomolecules','Transport in plants','Mineral nutrition','Photosynthesis','Respiration in plants','Plant growth and development','Sexual reproduction in flowering plants','Principles of inheritance and variation','Molecular basis of inheritance','Biotechnology: principles and processes','Organisms and populations','Ecosystem','Biodiversity and conservation']},
 zoo:{id:'zoo',name:'Zoology',short:'Zoo',c:'--zoo',ch:['Animal kingdom','Structural organisation in animals','Digestion and absorption','Breathing and exchange of gases','Body fluids and circulation','Excretory products and elimination','Locomotion and movement','Neural control and coordination','Chemical coordination and integration','Human reproduction','Reproductive health','Evolution','Human health and disease','Strategies for enhancing food production','Microbes in human welfare']}
};
var EXAMS={
 jee:{name:'JEE',total:300,subs:['phy','chem','math']},
 neet:{name:'NEET',total:720,subs:['phy','chem','bot','zoo']}
};
var TYPES={
 concept:{n:'Concept gap',c:'--t-concept',tip:'Go back to the theory, then solve five fresh problems on it.'},
 calc:{n:'Calculation error',c:'--t-calc',tip:'Write every step and check signs and units before moving on.'},
 silly:{n:'Silly mistake',c:'--t-silly',tip:'Underline what the question asks before you start solving.'},
 time:{n:'Ran out of time',c:'--t-time',tip:'Practise timed sets and skip long questions on the first pass.'},
 guess:{n:'Guessed',c:'--t-guess',tip:'Work out why the right option is right, not just which one it is.'}
};

/* ---------- State ---------- */
var KEY='prepdesk.v1';
var blank=function(){return {examDate:'',goal:6,focusMin:25,subject:'',prog:{},custom:{},sessions:[],tasks:[],tests:[],mistakes:[]};};
function migrate(o){
  var s={exam:'jee',theme:'auto',timer:{mode:'focus',running:false,endAt:0,left:null},d:{}};
  if(o&&typeof o==='object'){
    if(o.exam==='neet')s.exam='neet';
    if(['auto','light','dark'].indexOf(o.theme)>-1)s.theme=o.theme;
    if(o.timer&&typeof o.timer==='object')Object.assign(s.timer,o.timer);
  }
  ['jee','neet'].forEach(function(k){s.d[k]=Object.assign(blank(),(o&&o.d&&o.d[k])||{});});
  return s;
}
var S;
try{S=migrate(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){S=migrate(null);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var D=function(){return S.d[S.exam];};
var E=function(){return EXAMS[S.exam];};
var subs=function(){return E().subs.map(function(id){return SUB[id];});};
var tab='home',sylSub=null,mf={type:'all',status:'open'};

/* ---------- Derived data ---------- */
function chapters(sub){return sub.ch.map(function(n){return {n:n,custom:false};}).concat((D().custom[sub.id]||[]).map(function(n){return {n:n,custom:true};}));}
var pk=function(sid,n){return sid+'|'+n;};
var ps=function(sid,n){return D().prog[pk(sid,n)]||{t:0,p:0,r:0};};
function counts(sub){var c={n:0,t:0,p:0,r:0};chapters(sub).forEach(function(ch){var s=ps(sub.id,ch.n);c.n++;if(s.t)c.t++;if(s.p)c.p++;if(s.r)c.r++;});return c;}
function pct(sub){var c=counts(sub);return c.n?Math.round((c.t+c.p+c.r)/(c.n*3)*100):0;}
function overall(){var n=0,x=0;subs().forEach(function(s){var c=counts(s);n+=c.n*3;x+=c.t+c.p+c.r;});return n?Math.round(x/n*100):0;}
function minsByDay(){var m={};D().sessions.forEach(function(s){var k=dkey(new Date(s.ts));m[k]=(m[k]||0)+s.min;});return m;}
function streak(){var by=minsByDay(),d=new Date(),n=0;if(!by[dkey(d)])d.setDate(d.getDate()-1);while(by[dkey(d)]>0){n++;d.setDate(d.getDate()-1);}return n;}
function weekMins(){var by=minsByDay(),t=0;for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);t+=by[dkey(d)]||0;}return t;}
function todaySessions(){var t=dkey();return D().sessions.filter(function(s){return dkey(new Date(s.ts))===t;}).sort(function(a,b){return b.ts-a.ts;});}
function addSession(min,sub){D().sessions.push({id:uid(),ts:Date.now(),min:min,sub:sub||''});}
function dueRev(){
  var out=[];
  subs().forEach(function(s){chapters(s).forEach(function(c,i){var p=ps(s.id,c.n);if(p.t&&!p.r&&Date.now()-p.t>=7*DAY)out.push({s:s,c:c,i:i,days:Math.floor((Date.now()-p.t)/DAY)});});});
  return out.sort(function(a,b){return b.days-a.days;});
}
function weakest(){var w=null;subs().forEach(function(s){var p=pct(s);if(!w||p<w.p)w={s:s,p:p};});return w;}
var dotc=function(v){return 'style="--c:var('+v+')"';};

/* ---------- Timer ---------- */
var CIRC=2*Math.PI*98,BRK={short:5,long:15};
function totalMs(mode){mode=mode||S.timer.mode;return (mode==='focus'?D().focusMin:BRK[mode])*60000;}
function leftMs(){var t=S.timer;if(t.running)return Math.max(0,t.endAt-Date.now());return t.left==null?totalMs():t.left;}
var AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){
  try{
    unlockAudio();var t=AC.currentTime;
    [0,.25,.5].forEach(function(o,i){var osc=AC.createOscillator(),g=AC.createGain();osc.frequency.value=i===2?880:660;osc.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.2);osc.start(t+o);osc.stop(t+o+.22);});
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}
function completeTimer(){
  var t=S.timer,d=D(),wasFocus=t.mode==='focus';
  t.running=false;t.left=null;
  if(wasFocus){addSession(d.focusMin,d.subject);t.mode=(todaySessions().length%4===0)?'long':'short';toast('Focus session done. Take a break.');}
  else{t.mode='focus';toast('Break over. Start your next session when ready.');}
  save();beep();render();
}
function updTimer(){
  var t=S.timer,T=totalMs(),L=leftMs();
  document.title=t.running?fmtClock(L)+' | PrepDesk':BASE_TITLE;
  if(tab!=='focus')return;
  var c=$('#clock');if(!c)return;
  c.textContent=fmtClock(L);
  $('#arc').style.strokeDashoffset=String(CIRC*(1-L/T));
  $('#tstart').textContent=t.running?'Pause':((t.left==null||t.left>=T)?'Start':'Resume');
  $('#tstop').hidden=!(t.mode==='focus'&&(T-L)>=60000);
}
function tick(){if(S.timer.running&&Date.now()>=S.timer.endAt){completeTimer();return;}updTimer();}

function heat(){
  var by=minsByDay(),t0=sod(),dow=(t0.getDay()+6)%7,start=new Date(t0),h='',tk=dkey(t0);
  start.setDate(start.getDate()-dow-77);
  for(var i=0;i<84;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);
    var k=dkey(d),m=by[k]||0,fut=d>t0,l=0;
    if(m>0)l=1;if(m>=60)l=2;if(m>=180)l=3;if(m>=300)l=4;
    h+='<i class="hc '+(fut?'fut':'l'+l)+(k===tk?' now':'')+'" title="'+fmtDate(d)+': '+fmtMin(m)+'"></i>';
  }
  return h;
}

function chartSVG(tests,max){
  var W=340,H=190,pl=34,pr=16,pt=22,pb=26;
  var ts=tests.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts;});
  var vals=ts.map(function(t){return t.total;}),step=max/6;
  var lo=Math.max(0,Math.floor((Math.min.apply(null,vals)-max*.1)/step)*step);lo=Math.min(lo,Math.floor(Math.min.apply(null,vals)));if(lo>=max)lo=0;
  var x=function(i){return pl+(ts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(ts.length-1));};
  var y=function(v){return pt+(1-(v-lo)/(max-lo))*(H-pt-pb);};
  var g='';for(var k=0;k<4;k++){var v=lo+(max-lo)*k/3;g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>';}
  var path=ts.map(function(t,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(t.total).toFixed(1);}).join(' ');
  var pts=ts.map(function(t,i){return '<circle class="pt" cx="'+x(i).toFixed(1)+'" cy="'+y(t.total).toFixed(1)+'" r="'+(i===ts.length-1?7:5)+'"/>';}).join('');
  var last=ts[ts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart of your mock test totals over time">'+g+(ts.length>1?'<path class="ln" d="'+path+'"/>':'')+pts+
   '<text class="lab" x="'+Math.min(W-pr-12,Math.max(pl+12,x(ts.length-1)))+'" y="'+(y(last.total)-12)+'">'+last.total+'</text>'+
   '<text class="ax" x="'+pl+'" y="'+(H-6)+'">'+fmtDate(ts[0].date)+'</text>'+(ts.length>1?'<text class="ax" x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+fmtDate(last.date)+'</text>':'')+'</svg>';
}

  var head='<section class="sec first"><div class="sec-h"><h2>Mock tests</h2><button class="btn sm" data-act="add-test">Add test</button></div>';

function vMist(){
  var d=D(),all=d.mistakes,cnt={};
  Object.keys(TYPES).forEach(function(k){cnt[k]=all.filter(function(m){return m.type===k;}).length;});
  var open=all.filter(function(m){return !m.fixed;}).length;
  var list=all.filter(function(m){return (mf.type==='all'||m.type===mf.type)&&(mf.status==='all'||(mf.status==='open'?!m.fixed:m.fixed));}).sort(function(a,b){return b.ts-a.ts;});
  var dist='';
  if(all.length>=3){
    var top=Object.keys(TYPES).sort(function(a,b){return cnt[b]-cnt[a];})[0];
    dist='<div class="dist" role="img" aria-label="Mistakes by type">'+Object.keys(TYPES).filter(function(k){return cnt[k];}).map(function(k){return '<i '+dotc(TYPES[k].c)+' style="width:'+(cnt[k]/all.length*100)+'%"></i>';}).join('')+'</div>'+
     '<p><b>'+Math.round(cnt[top]/all.length*100)+'%</b> of your mistakes are "'+TYPES[top].n.toLowerCase()+'". '+TYPES[top].tip+'</p>';
  }
  var rows=list.map(function(m){var s=SUB[m.sub],ty=TYPES[m.type]||TYPES.concept;return '<li class="mrow'+(m.fixed?' fixed':'')+'"><button class="bub sm'+(m.fixed?' on':'')+'" role="checkbox" aria-checked="'+!!m.fixed+'" aria-label="Mark as fixed" data-act="mfix" data-id="'+m.id+'"></button><div class="grow"><div class="mtop">'+(s?'<i class="dot" '+dotc(s.c)+'></i><b>'+s.name+'</b>':'')+(m.chapter?'<span class="muted">'+esc(m.chapter)+'</span>':'')+'<span class="tag" '+dotc(ty.c)+'>'+ty.n+'</span></div><p class="note">'+esc(m.note)+'</p><div class="muted sm" style="margin-top:4px">'+fmtDate(m.ts)+'</div></div><button class="x" data-act="del-m" data-id="'+m.id+'" aria-label="Delete mistake">\u00d7</button></li>';}).join('');
  var chip=function(act,v,label,cur){return '<button class="chip" data-act="'+act+'" data-v="'+v+'" aria-pressed="'+(cur===v)+'">'+label+'</button>';};
  return '<section class="sec first"><div class="sec-h"><h2>Mistake notebook</h2><button class="btn sm" data-act="add-m">Add mistake</button></div>'+
   '<p class="muted" style="margin:-6px 0 14px">Log each wrong answer once, with the reason. Fill the bubble after you re-solve it without help.</p>'+dist+'</section>'+
   '<section class="sec"><div class="chips" role="group" aria-label="Show">'+chip('mf-status','open','To fix ('+open+')',mf.status)+chip('mf-status','fixed','Fixed ('+(all.length-open)+')',mf.status)+chip('mf-status','all','All',mf.status)+'</div>'+
   '<div class="chips" role="group" aria-label="Type">'+chip('mf-type','all','Every type',mf.type)+Object.keys(TYPES).map(function(k){return chip('mf-type',k,TYPES[k].n+' ('+cnt[k]+')',mf.type);}).join('')+'</div>'+
   (rows?'<ul class="list">'+rows+'</ul>':'<p class="empty">'+(all.length?'Nothing matches this filter.':'No mistakes logged. After your next test, add every question you got wrong and why.')+'</p>')+'</section>';
}

function render(){
  applyTheme();renderChrome();
  var v=$('#view');
  v.innerHTML=({home:vHome,focus:vFocus,syllabus:vSyl,tests:vTests,mistakes:vMist})[tab]();
  if(tab==='syllabus'){sylStats();sylList();}
  updTimer();
}

/* ---------- Modals ---------- */
function modalDate(){
  openModal('<h3>Exam date</h3><p class="muted" style="margin-bottom:14px">Check the official schedule and enter your '+E().name+' date.</p><label class="field">Date<input type="date" id="dateIn" value="'+esc(D().examDate)+'"></label><div class="acts">'+(D().examDate?'<button class="btn ghost" data-act="cleardate">Remove</button>':'')+'<button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="savedate">Save date</button></div>');
}
function modalTest(){
  var e=E(),sm=e.total/e.subs.length;
  openModal('<h3>Add a mock test</h3><label class="field">Name<input id="tName" maxlength="60" value="Mock test '+(D().tests.length+1)+'"></label><label class="field">Date<input type="date" id="tDate" value="'+dkey()+'"></label><div class="two">'+
   e.subs.map(function(id){return '<label class="field">'+SUB[id].name+' (max '+sm+')<input type="number" step="1" id="t_'+id+'" placeholder="Marks"></label>';}).join('')+'</div><p><b id="tTotal">Total 0 / '+e.total+'</b></p><p class="err" id="tErr" role="alert"></p><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="save-test">Save test</button></div>');
}
function updTotal(){var t=0;E().subs.forEach(function(id){t+=Number($('#t_'+id).value)||0;});$('#tTotal').textContent='Total '+t+' / '+E().total;}
function modalMist(){
  var opts=subs().map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join('');
  openModal('<h3>Add a mistake</h3><div class="two"><label class="field">Subject<select id="mSub">'+opts+'</select></label><label class="field">Chapter<select id="mCh"></select></label></div><label class="field">Why did it go wrong?<select id="mType">'+Object.keys(TYPES).map(function(k){return '<option value="'+k+'">'+TYPES[k].n+'</option>';}).join('')+'</select></label><label class="field">What should you remember?<textarea id="mNote" maxlength="500" placeholder="e.g. Forgot that friction acts opposite to relative motion, not velocity."></textarea></label><p class="err" id="mErr" role="alert"></p><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="save-m">Save mistake</button></div>');
  fillCh();
}
function fillCh(){var s=SUB[$('#mSub').value];$('#mCh').innerHTML='<option value="">Not sure</option>'+chapters(s).map(function(c){return '<option>'+esc(c.n)+'</option>';}).join('');}
function modalData(){
  openModal('<h3>Your data</h3><p class="muted">Everything is saved in this browser on this device. Copy a backup to keep it safe or move it to another device.</p><h4>Backup</h4><textarea id="bk" readonly rows="4">'+esc(JSON.stringify(S))+'</textarea><div class="acts"><button class="btn" data-act="copy-bk">Copy backup</button></div><h4>Restore</h4><textarea id="rs" placeholder="Paste a backup here"></textarea><p class="err" id="rsErr" role="alert"></p><div class="acts"><button class="btn ghost" data-act="restore">Restore backup</button></div><h4>Start over</h4><div class="acts" style="justify-content:flex-start"><button class="btn danger" data-act="reset-all">Erase all data</button><button class="btn ghost" data-act="close">Close</button></div>');
}

/* ---------- Actions ---------- */
var ACT={
 tab:function(v){tab=v;render();window.scrollTo(0,0);},
 exam:function(v){S.exam=v;sylSub=null;mf={type:'all',status:'open'};save();render();},
 theme:function(){var o=['auto','light','dark'];S.theme=o[(o.indexOf(S.theme)+1)%3];save();render();toast('Theme: '+S.theme);},
 data:modalData,
 setdate:modalDate,
 savedate:function(){D().examDate=$('#dateIn').value||'';save();closeModal();render();},
 cleardate:function(){D().examDate='';save();closeModal();render();},
 goal:function(v){var d=D();d.goal=Math.max(1,Math.min(12,d.goal+Number(v)));save();render();},
 'add-task':function(){var i=$('#taskIn'),v=(i.value||'').trim();if(!v){i.focus();return;}D().tasks.push({id:uid(),text:v,done:false,date:dkey()});save();render();var n=$('#taskIn');if(n)n.focus();},
 task:function(v,id){var t=D().tasks.filter(function(x){return x.id===id;})[0];if(t){t.done=!t.done;t.date=dkey();save();render();}},
 'del-task':function(v,id){D().tasks=D().tasks.filter(function(x){return x.id!==id;});save();render();},
 'clear-done':function(){D().tasks=D().tasks.filter(function(x){return !x.done;});save();render();},
 'go-syl':function(v){sylSub=v;tab='syllabus';render();window.scrollTo(0,0);},
 'mark-r':function(v,id,el){var s=SUB[el.dataset.s],c=chapters(s)[Number(el.dataset.i)],k=pk(s.id,c.n),p=D().prog[k]||(D().prog[k]={t:0,p:0,r:0});p.r=Date.now();save();render();toast('Marked as revised');},
 tstart:function(){var t=S.timer;if(t.running){t.left=Math.max(0,t.endAt-Date.now());t.running=false;}else{var l=leftMs();t.endAt=Date.now()+l;t.running=true;unlockAudio();}save();render();},
 treset:function(){var t=S.timer;t.running=false;t.left=null;save();render();},
 tmode:function(v){var t=S.timer;t.mode=v;t.running=false;t.left=null;save();render();},
 tdur:function(v){var d=D();d.focusMin=Math.max(5,Math.min(120,d.focusMin+Number(v)));if(S.timer.mode==='focus'&&!S.timer.running)S.timer.left=null;save();render();},
 tsubj:function(v){D().subject=v;save();render();},
 tstop:function(){var t=S.timer,m=Math.floor((totalMs()-leftMs())/60000);if(m>=1){addSession(m,D().subject);toast('Logged '+fmtMin(m));}t.running=false;t.left=null;save();render();},
 addtime:function(){var i=$('#manMin'),m=Math.round(Number(i.value));if(!m||m<1||m>600){toast('Enter minutes between 1 and 600');return;}addSession(m,D().subject);save();render();toast('Added '+fmtMin(m));},
 'del-sess':function(v,id){D().sessions=D().sessions.filter(function(x){return x.id!==id;});save();render();},
 sylsub:function(v){sylSub=v;render();},
 bub:function(v,id,el){
   var s=SUB[el.dataset.s],c=chapters(s)[Number(el.dataset.i)],k=pk(s.id,c.n),kk=el.dataset.k,p=D().prog[k]||(D().prog[k]={t:0,p:0,r:0});
   p[kk]=p[kk]?0:Date.now();save();
   el.classList.toggle('on',!!p[kk]);el.setAttribute('aria-checked',String(!!p[kk]));sylStats();
 },
 'add-ch':function(){var i=$('#chIn'),v=(i.value||'').trim();if(!v){i.focus();return;}var c=D().custom;(c[sylSub]=c[sylSub]||[]).push(v);save();render();},
 'del-ch':function(v,id,el){var s=SUB[el.dataset.s],c=chapters(s)[Number(el.dataset.i)];if(!c||!c.custom)return;D().custom[s.id]=D().custom[s.id].filter(function(n){return n!==c.n;});delete D().prog[pk(s.id,c.n)];save();render();},
 'add-test':modalTest,
 'save-test':function(){
   var e=E(),sm=e.total/e.subs.length,marks={},total=0,err=$('#tErr');
   var name=($('#tName').value||'').trim()||('Mock test '+(D().tests.length+1)),date=$('#tDate').value||dkey();
   for(var i=0;i<e.subs.length;i++){
     var id=e.subs[i],raw=$('#t_'+id).value.trim();
     if(raw===''){err.textContent='Enter your '+SUB[id].name+' marks. Use 0 if you skipped it.';return;}
     var v=Number(raw);
     if(!isFinite(v)||v>sm||v<-sm/4){err.textContent=SUB[id].name+' marks must be between -'+(sm/4)+' and '+sm+'.';return;}
     marks[id]=v;total+=v;
   }
   D().tests.push({id:uid(),name:name,date:date,marks:marks,total:total,ts:Date.now()});save();closeModal();render();toast('Test saved');
 },
 'del-test':function(v,id){ask('Delete this test?','Its scores are removed from your trend and averages.','Delete',function(){D().tests=D().tests.filter(function(x){return x.id!==id;});save();render();});},
 'add-m':modalMist,
 'save-m':function(){
   var note=($('#mNote').value||'').trim();
   if(!note){$('#mErr').textContent='Write a short note so you can learn from this later.';return;}
   D().mistakes.push({id:uid(),ts:Date.now(),sub:$('#mSub').value,chapter:$('#mCh').value,type:$('#mType').value,note:note,fixed:false});
   save();closeModal();render();toast('Mistake saved');
 },
 mfix:function(v,id){var m=D().mistakes.filter(function(x){return x.id===id;})[0];if(m){m.fixed=!m.fixed;save();render();}},
 'del-m':function(v,id){D().mistakes=D().mistakes.filter(function(x){return x.id!==id;});save();render();},
 'mf-type':function(v){mf.type=v;render();},
 'mf-status':function(v){mf.status=v;render();},
 close:closeModal,
 yes:function(){var f=onYes;onYes=null;closeModal();if(f)f();},
 'copy-bk':function(){
   var ta=$('#bk');ta.focus();ta.select();
   var done=function(){toast('Backup copied');};
   if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,function(){try{document.execCommand('copy');done();}catch(e){toast('Select the text and copy it');}});}
   else{try{document.execCommand('copy');done();}catch(e){toast('Select the text and copy it');}}
 },
 restore:function(){
   try{var o=JSON.parse($('#rs').value.trim());if(!o||typeof o!=='object'||!o.d)throw 0;S=migrate(o);save();closeModal();render();toast('Backup restored');}
   catch(e){$('#rsErr').textContent='That is not a valid PrepDesk backup. Copy the whole text and try again.';}
 },
 'reset-all':function(){ask('Erase all data?','This removes your progress, sessions, tests and mistakes from this browser. It cannot be undone.','Erase everything',function(){S=migrate(null);save();tab='home';render();toast('All data erased');});}
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var f=ACT[el.dataset.act];if(f)f(el.dataset.v,el.dataset.id,el,e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return;}
  if(e.key==='Enter'&&e.target.id){var m={taskIn:'add-task',chIn:'add-ch',manMin:'addtime'}[e.target.id];if(m){e.preventDefault();ACT[m]();}}
});
document.addEventListener('input',function(e){var id=e.target.id||'';if(id==='sylq')filterSyl();else if(id.indexOf('t_')===0)updTotal();});
document.addEventListener('change',function(e){if(e.target.id==='mSub')fillCh();});
$('#modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('visibilitychange',tick);

render();tick();setInterval(tick,500);
})();
</script>
</body>
</html>
